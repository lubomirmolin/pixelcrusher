[package]
name = "pixelcrusher-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
regex = "1.11"
resvg = "0.47.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny-skia = "0.12.0"
thiserror = "2.0"
usvg = "0.47.0"
which = "8.0"

[dev-dependencies]
tempfile = "3.23"
