name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS native artifacts
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -e 'const fs=require("node:fs");const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));process.stdout.write(pkg.version);')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync app version from tag/config
        run: node scripts/version_sync.cjs --set "${{ steps.version.outputs.version }}" --check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native macOS artifacts
        env:
          PIXELCRUSHER_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build-macos.sh

      - name: Verify updater + versioned macOS assets
        run: |
          test -f "dist/PixelCrusher-${{ steps.version.outputs.version }}.zip"
          test -f "dist/PixelCrusher-${{ steps.version.outputs.version }}.dmg"

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/PixelCrusher-${{ steps.version.outputs.version }}.dmg
            dist/PixelCrusher-${{ steps.version.outputs.version }}.zip

  build-linux:
    name: Build Linux artifacts
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -e 'const fs=require("node:fs");const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));process.stdout.write(pkg.version);')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync app version from tag/config
        run: node scripts/version_sync.cjs --set "${{ steps.version.outputs.version }}" --check

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend + queue smoke tests
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Prepare bundled optimizer toolchain (Linux)
        run: npm run bundled-tools:prepare

      - name: Build Linux bundles
        run: npm run tauri:build:linux

      - name: Verify bundled tools in Linux bundle output
        run: npm run bundled-tools:check:linux

      - name: Verify Linux artifact filenames include synced version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' \) | while read -r file; do
            base="$(basename "$file")"
            if [[ "$base" != *"$VERSION"* ]]; then
              echo "Artifact filename missing synced version: $base"
              exit 1
            fi
          done

      - name: Print Linux artifact sizes
        run: |
          find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' \) -print0 | xargs -0 ls -lh
          cat dist/bundle-evidence/bundled-tools-linux.txt

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.deb
            dist/bundle-evidence/bundled-tools-linux.txt

  build-windows:
    name: Build Windows artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -e 'const fs=require("node:fs");const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));process.stdout.write(pkg.version);')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync app version from tag/config
        run: node scripts/version_sync.cjs --set "${{ steps.version.outputs.version }}" --check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend + queue smoke tests
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Prepare bundled optimizer toolchain (Windows)
        run: npm run bundled-tools:prepare

      - name: Build Windows bundles
        run: npm run tauri:build:windows

      - name: Verify bundled tools in Windows bundle output
        run: npm run bundled-tools:check:windows

      - name: Verify Windows artifact filenames include synced version
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $artifacts = Get-ChildItem -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle -Recurse -Include *.msi,*.exe
          foreach ($artifact in $artifacts) {
            if (-not $artifact.Name.Contains($version)) {
              throw "Artifact filename missing synced version: $($artifact.Name)"
            }
          }

      - name: Create deterministic Windows updater alias asset
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist/release-alias | Out-Null

          $allExe = @(Get-ChildItem -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle -Recurse -Include *.exe)
          if ($allExe.Count -eq 0) {
            throw "No Windows .exe release artifacts found"
          }

          $preferredExe = $allExe |
            Where-Object { $_.Name -match 'setup' } |
            Sort-Object Name |
            Select-Object -First 1
          if (-not $preferredExe) {
            $preferredExe = $allExe | Sort-Object Name | Select-Object -First 1
          }

          Copy-Item $preferredExe.FullName "dist/release-alias/PixelCrusher-$version-windows-installer.exe" -Force

      - name: Print Windows artifact sizes
        shell: pwsh
        run: |
          Get-ChildItem -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle -Recurse -Include *.msi,*.exe |
            Select-Object FullName, Length |
            Format-Table -AutoSize
          Get-ChildItem -Path dist/release-alias -File | Select-Object FullName, Length | Format-Table -AutoSize
          Get-Content dist/bundle-evidence/bundled-tools-windows.txt

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
            dist/release-alias/PixelCrusher-*-windows-installer.exe
            dist/bundle-evidence/bundled-tools-windows.txt

  publish:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-linux
      - build-windows

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List collected artifacts
        run: find artifacts -type f | sort

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/bundled-tools-*.txt
