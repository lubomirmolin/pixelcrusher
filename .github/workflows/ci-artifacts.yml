name: CI Artifacts

on:
  push:
    branches: ["main"]
    tags-ignore: ["v*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-native:
    if: github.event_name == 'push'
    name: macOS native app (.dmg/.zip)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build native macOS artifacts
        run: bash scripts/build-macos.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixelcrusher-macos-native
          path: |
            dist/PixelCrusher.dmg
            dist/PixelCrusher.zip

  linux-tauri:
    name: Linux Tauri bundles (AppImage/deb)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare bundled optimizer toolchain (Linux)
        run: npm run bundled-tools:prepare

      - name: Build Linux bundles
        run: npm run tauri:build:linux

      - name: Verify bundled tools in Linux bundle output
        run: npm run bundled-tools:check:linux

      - name: Print Linux artifact sizes
        run: |
          find src-tauri/target/x86_64-unknown-linux-gnu/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' \) -print0 | xargs -0 ls -lh
          cat dist/bundle-evidence/bundled-tools-linux.txt

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixelcrusher-linux-bundles
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.deb
            dist/bundle-evidence/bundled-tools-linux.txt

  windows-tauri:
    if: github.event_name == 'push'
    name: Windows Tauri bundles (.msi/.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare bundled optimizer toolchain (Windows)
        run: npm run bundled-tools:prepare

      - name: Build Windows bundles
        run: npm run tauri:build:windows

      - name: Verify bundled tools in Windows bundle output
        run: npm run bundled-tools:check:windows

      - name: Print Windows artifact sizes
        shell: pwsh
        run: |
          Get-ChildItem -Path src-tauri/target/x86_64-pc-windows-msvc/release/bundle -Recurse -Include *.msi,*.exe |
            Select-Object FullName, Length |
            Format-Table -AutoSize
          Get-Content dist/bundle-evidence/bundled-tools-windows.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixelcrusher-windows-bundles
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
            dist/bundle-evidence/bundled-tools-windows.txt
