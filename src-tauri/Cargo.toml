[package]
name = "pixelcrusher-app"
version = "0.1.5"
description = "PixelCrusher desktop app"
authors = ["Bartando"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"
rfd = "0.15"
uuid = { version = "1.18", features = ["v4", "serde"] }
pixelcrusher-core = { path = "../crates/pixelcrusher-core" }

[dev-dependencies]
tempfile = "3"

